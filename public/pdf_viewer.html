<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>Lecteur PDF Clinique</title>
  
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Outfit Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #090d16;
      --bg-header: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --color-primary: #06b6d4;
      --color-primary-hover: #0891b2;
      --transition-smooth: all 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Viewer Header - Compact Single Row */
    .viewer-header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .back-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }

    .back-btn:hover {
      color: var(--text-primary);
      border-color: var(--color-primary);
      background-color: rgba(6, 182, 212, 0.1);
    }

    .doc-title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    /* Page Navigation and Zoom controls in center */
    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      background-color: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2px;
      gap: 2px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .control-btn:hover {
      color: var(--color-primary);
      background-color: rgba(6, 182, 212, 0.1);
    }

    .control-btn:disabled {
      color: #1e293b;
      cursor: not-allowed;
      background: none;
    }

    .page-indicator {
      font-size: 12.5px;
      font-weight: 600;
      padding: 0 4px;
      min-width: 80px;
      text-align: center;
      color: var(--text-secondary);
    }

    /* Viewer Container */
    .viewer-container {
      flex-grow: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px 12px 30px 12px; /* Reduced bottom padding for a tighter, cleaner look */
      background-color: #070a10;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    /* Canvas styling - NO max-width to allow zooming to overflow */
    canvas {
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.8);
      background-color: #fff;
      border-radius: 4px;
      display: block;
      margin: 0 auto;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(9, 13, 22, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(6, 182, 212, 0.1);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Mobile Adaptations (Single Row Toolbar Layout) */
    @media (max-width: 768px) {
      .viewer-header {
        height: 48px;
        padding: 0 6px;
      }
      
      .doc-title {
        display: none; /* Hide document title on very small screens to save space */
      }
      
      .header-left {
        flex: 0 0 auto;
      }

      .header-center {
        flex-grow: 1;
        justify-content: flex-end;
        gap: 6px;
      }

      .page-indicator {
        min-width: 68px;
        font-size: 12px;
      }

      .control-btn {
        width: 28px;
        height: 28px;
      }
    }
  </style>

  <!-- Load PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="viewer-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" title="Retour à l'application"><i class="fa-solid fa-arrow-left"></i></a>
      <span class="doc-title" id="doc-title">Chargement...</span>
    </div>
    
    <div class="header-center">
      <!-- Navigation -->
      <div class="control-group">
        <button class="control-btn" id="prev-page-btn" disabled><i class="fa-solid fa-chevron-left"></i></button>
        <span class="page-indicator" id="page-indicator">Page 0 / 0</span>
        <button class="control-btn" id="next-page-btn" disabled><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <!-- Zoom & Controls -->
      <div class="control-group">
        <button class="control-btn" id="zoom-out-btn" title="Zoom arrière"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="control-btn" id="zoom-fit-btn" title="Ajuster à la largeur"><i class="fa-solid fa-expand"></i></button>
        <button class="control-btn" id="zoom-in-btn" title="Zoom avant"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      </div>

      <div class="control-group">
        <button class="control-btn" id="fullscreen-btn" title="Plein écran"><i class="fa-solid fa-expand"></i></button>
      </div>
    </div>
  </header>

  <!-- Viewer Container -->
  <main class="viewer-container" id="viewer-container">
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Chargement du PDF...</div>
    </div>
    <canvas id="pdf-canvas"></canvas>
  </main>

  <script>
    // Set PDF.js worker source
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const pdfFileName = urlParams.get('file');
    let currentPageNum = parseInt(urlParams.get('page')) || 1;

    if (!pdfFileName) {
      document.getElementById('loading-text').textContent = "Erreur : Aucun document spécifié.";
      document.getElementById('loading-overlay').querySelector('.spinner').style.display = 'none';
      throw new Error("No PDF file specified");
    }

    // Clean display title
    const displayTitle = pdfFileName.replace(/^\d+锔忊儯\d+锔忊儯/i, '')
                                    .replace(/^\d+锔忊儯/i, '')
                                    .replace(/馃[A-Z0-9]/g, '')
                                    .replace(/_/g, ' ')
                                    .replace(/\.pdf$/i, '');
    document.getElementById('doc-title').textContent = displayTitle;

    const pdfUrl = `pdfs/${encodeURIComponent(pdfFileName)}`;
    
    let pdfDoc = null;
    let pageRendering = false;
    let pageNumPending = null;
    
    let currentScale = 1.0;
    let currentFitMode = 'width'; // 'width' or 'value' (manual zoom scale)
    
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const container = document.getElementById('viewer-container');

    const prevBtn = document.getElementById('prev-page-btn');
    const nextBtn = document.getElementById('next-page-btn');
    const pageIndicator = document.getElementById('page-indicator');

    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const zoomFitBtn = document.getElementById('zoom-fit-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let renderTask = null;

    /**
     * Render PDF page onto high-DPI canvas
     */
    async function renderPage(num) {
      pageRendering = true;
      loadingOverlay.style.display = 'flex';
      loadingText.textContent = `Rendu de la page ${num}...`;

      if (renderTask) {
        try {
          renderTask.cancel();
        } catch (_) {}
      }

      try {
        const page = await pdfDoc.getPage(num);

        // 1. Calculate dynamic scale for Fit-to-Width / Fit-to-Page modes
        if (currentFitMode === 'width') {
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const containerWidth = container.clientWidth;
          const padding = window.innerWidth <= 768 ? 16 : 24;
          currentScale = (containerWidth - padding) / unscaledViewport.width;
        } else if (currentFitMode === 'page') {
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const containerWidth = container.clientWidth;
          const containerHeight = container.clientHeight;
          const paddingX = window.innerWidth <= 768 ? 16 : 24;
          const paddingY = window.innerWidth <= 768 ? 16 : 24;
          const scaleX = (containerWidth - paddingX) / unscaledViewport.width;
          const scaleY = (containerHeight - paddingY) / unscaledViewport.height;
          currentScale = Math.min(scaleX, scaleY);
        }

        // 2. High-DPI (Retina) scaling
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: currentScale });

        // Set backing store dimensions scaled by devicePixelRatio
        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;

        // Set CSS styling dimensions to match the logical layout viewport
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        // Reset transforms and apply devicePixelRatio scale factor
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        
        renderTask = page.render(renderContext);
        await renderTask.promise;
        
        pageRendering = false;
        loadingOverlay.style.display = 'none';

        // Update navigation UI
        pageIndicator.textContent = `Page ${num} / ${pdfDoc.numPages}`;
        prevBtn.disabled = num <= 1;
        nextBtn.disabled = num >= pdfDoc.numPages;

        // Update browser URL silently
        const url = new URL(window.location);
        url.searchParams.set('page', num);
        window.history.replaceState({}, '', url);

        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      } catch (err) {
        if (err.name === 'RenderingCancelledException') {
          return;
        }
        console.error("Render error:", err);
        loadingText.textContent = "Erreur de rendu.";
      }
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function onPrevPage() {
      if (currentPageNum <= 1) return;
      currentPageNum--;
      queueRenderPage(currentPageNum);
    }

    function onNextPage() {
      if (currentPageNum >= pdfDoc.numPages) return;
      currentPageNum++;
      queueRenderPage(currentPageNum);
    }

    // Nav Event Listeners
    prevBtn.addEventListener('click', onPrevPage);
    nextBtn.addEventListener('click', onNextPage);

    // Zoom Out
    zoomOutBtn.addEventListener('click', () => {
      // If we are currently in fit-to-width or fit-to-page, switch to absolute scaling
      if (currentFitMode === 'width' || currentFitMode === 'page') {
        currentFitMode = 'value';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        zoomFitBtn.title = "Ajuster à la largeur";
      }
      if (currentScale <= 0.4) return;
      currentScale -= 0.15;
      queueRenderPage(currentPageNum);
    });

    // Zoom In
    zoomInBtn.addEventListener('click', () => {
      if (currentFitMode === 'width' || currentFitMode === 'page') {
        currentFitMode = 'value';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        zoomFitBtn.title = "Ajuster à la largeur";
      }
      currentScale += 0.15;
      queueRenderPage(currentPageNum);
    });

    // Fit to Width / Page Toggle
    zoomFitBtn.addEventListener('click', () => {
      if (currentFitMode === 'width') {
        currentFitMode = 'page';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-arrows-to-eye"></i>';
        zoomFitBtn.title = "Ajuster à la page entière";
      } else {
        currentFitMode = 'width';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        zoomFitBtn.title = "Ajuster à la largeur";
      }
      queueRenderPage(currentPageNum);
    });

    // Fullscreen API implementation
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error("Fullscreen request failed:", err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Back button history navigation
    const backBtn = document.querySelector('.back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });
    }

    // Sync fullscreen button icon
    document.addEventListener('fullscreenchange', () => {
      const icon = fullscreenBtn.querySelector('i');
      if (document.fullscreenElement) {
        icon.className = 'fa-solid fa-compress';
      } else {
        icon.className = 'fa-solid fa-expand';
      }
      // Re-render to adapt to full height/width changes
      setTimeout(() => {
        queueRenderPage(currentPageNum);
      }, 100);
    });

    // Keyboards
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        onPrevPage();
      } else if (e.key === 'ArrowRight') {
        onNextPage();
      }
    });

    // Auto-fit on window resize
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (currentFitMode === 'width') {
          queueRenderPage(currentPageNum);
        }
      }, 150);
    });

    // Load PDF Document
    (async function() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        pdfDoc = await loadingTask.promise;
        renderPage(currentPageNum);
      } catch (err) {
        console.error("Load error:", err);
        loadingText.textContent = "Erreur de chargement du PDF. Vérifiez le fichier.";
        document.getElementById('loading-overlay').querySelector('.spinner').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
