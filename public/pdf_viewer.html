<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Lecteur PDF Clinique</title>

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Outfit Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>

  <style>
    :root {
      --bg-app: #090d16;
      --bg-header: #0f172a;
      --bg-control: #1e293b;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --color-primary: #06b6d4;
      --color-primary-hover: #0891b2;
      --viewer-canvas-bg: #070a10;
      --transition-smooth: all 0.2s ease-in-out;
    }

    html.light-theme {
      --bg-app: #f1f5f9;
      --bg-header: #ffffff;
      --bg-control: #e2e8f0;
      --bg-card: #ffffff;
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #94a3b8;
      --color-primary: #0e7490;
      --color-primary-hover: #155e75;
      --viewer-canvas-bg: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s ease;
    }

    /* Viewer Header - Compact Single Row */
    .viewer-header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      z-index: 100;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }

    .back-btn:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
      background-color: rgba(6, 182, 212, 0.12);
    }

    .doc-title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    /* Page Navigation and Zoom controls in center - Smooth Scroll Bar */
    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
      min-width: 0;
      justify-content: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px;
    }

    .header-center::-webkit-scrollbar {
      display: none;
    }

    /* Pill-Shaped Control Groups (Master Style) */
    .control-group {
      display: flex;
      align-items: center;
      background-color: var(--bg-control);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2px 4px;
      gap: 2px;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* Circular Frameless Icon Buttons (Master Style) */
    .control-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13.5px;
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }

    .control-btn:hover:not(:disabled) {
      color: var(--color-primary);
      background-color: rgba(6, 182, 212, 0.12);
    }

    .control-btn:disabled {
      color: var(--text-muted);
      opacity: 0.35;
      cursor: not-allowed;
      background: none;
    }

    .page-indicator {
      font-size: 13px;
      font-weight: 600;
      padding: 0 4px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Editable page input */
    #page-input {
      width: 40px;
      height: 28px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 0;
      -moz-appearance: textfield;
      transition: border-color 0.2s ease;
    }

    #page-input:focus {
      border-color: var(--color-primary);
      outline: none;
    }

    #page-input::-webkit-outer-spin-button,
    #page-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .page-total {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Zoom level readout */
    .zoom-level {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 42px;
      text-align: center;
    }

    /* Mobile Adaptations */
    @media (max-width: 600px) {
      .header-left {
        max-width: none;
      }
      .doc-title {
        display: none;
      }
      .header-center {
        justify-content: flex-start;
      }
    }

    /* Viewer Container */
    .viewer-container {
      flex-grow: 1;
      overflow: auto;          /* scroll area for panning when zoomed */
      display: block;          /* block + margin:auto centers small pages AND keeps zoomed pages fully scrollable (flex centering clipped overflow) */
      padding: 16px;
      background-color: var(--viewer-canvas-bg);
      position: relative;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      transition: background-color 0.2s ease;
    }

    /* Canvas styling */
    canvas {
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.4);
      background-color: #fff;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }

    /* Light spinner shown during page turns (does not cover the screen) */
    #page-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      z-index: 5;
      pointer-events: none;
    }

    /* Loading Overlay (initial document load only) */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(9, 13, 22, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(6, 182, 212, 0.1);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
    }

    /* Retry button */
    #retry-btn {
      background: var(--color-primary);
      color: #090d16;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: none;
    }
    #retry-btn:hover {
      background: var(--color-primary-hover);
    }

    /* Mobile Adaptations (Single Row Toolbar Layout) */
    @media (max-width: 768px) {
      .viewer-header {
        height: 48px;
        padding: 0 6px;
      }

      .doc-title {
        display: none;
      }

      .header-left {
        flex: 0 0 auto;
      }

      .header-center {
        flex-grow: 1;
        justify-content: flex-end;
        gap: 6px;
      }

      .page-indicator {
        min-width: 68px;
        font-size: 12px;
      }

      .control-btn {
        width: 28px;
        height: 28px;
      }
    }
  </style>

</head>
<body>

  <!-- Header -->
  <header class="viewer-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" title="Retour à l'application"><i class="fa-solid fa-arrow-left"></i></a>
      <span class="doc-title" id="doc-title">Chargement...</span>
    </div>

    <div class="header-center">
      <!-- Navigation -->
      <div class="control-group">
        <button class="control-btn" id="prev-page-btn" disabled><i class="fa-solid fa-chevron-left"></i></button>
        <input id="page-input" type="number" min="1" value="1" aria-label="Numéro de page">
        <span class="page-total">/ <span id="page-total">0</span></span>
        <button class="control-btn" id="next-page-btn" disabled><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <!-- Zoom & Controls -->
      <div class="control-group">
        <button class="control-btn" id="zoom-out-btn" title="Zoom arrière"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button class="control-btn" id="zoom-fit-btn" title="Ajuster à la largeur"><i class="fa-solid fa-expand"></i></button>
        <button class="control-btn" id="zoom-in-btn" title="Zoom avant"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      </div>

      <!-- Open in external PDF app -->
      <div class="control-group">
        <button class="control-btn" id="open-external-btn" title="Ouvrir dans une autre application PDF"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
      </div>

      <div class="control-group">
        <button class="control-btn" id="fullscreen-btn" title="Plein écran"><i class="fa-solid fa-expand"></i></button>
      </div>
    </div>
  </header>

  <!-- Viewer Container -->
  <main class="viewer-container" id="viewer-container">
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Chargement du PDF...</div>
      <button id="retry-btn">Réessayer</button>
    </div>
    <div id="page-spinner"></div>
    <canvas id="pdf-canvas"></canvas>
  </main>

  <script src="js/pdf.min.js"></script>
  <script>
    // Set PDF.js worker source lazily (Phase 5.3): only fetch the worker when
    // a PDF actually starts loading, not on every viewer-page open.
    // (workerSrc is assigned just before getDocument below.)

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const pdfFileName = urlParams.get('file');
    let currentPageNum = parseInt(urlParams.get('page')) || 1;

    if (!pdfFileName) {
      document.getElementById('loading-text').textContent = "Erreur : Aucun document spécifié.";
      document.getElementById('loading-overlay').querySelector('.spinner').style.display = 'none';
      throw new Error("No PDF file specified");
    }

    // Clean display title (strip leading numeric / separator prefixes)
    const displayTitle = pdfFileName
      .replace(/^\d+[\s_-]+/i, '')
      .replace(/_/g, ' ')
      .replace(/\.pdf$/i, '')
      .trim();
    document.getElementById('doc-title').textContent = displayTitle;

    const pdfUrl = `pdfs/${encodeURIComponent(pdfFileName)}`;

    let pdfDoc = null;
    let pageRendering = false;
    let pageNumPending = null;
    let initialLoadDone = false;

    const MAX_SCALE = 5.0;   // hard cap to avoid gigantic backing stores
    const MIN_SCALE = 0.4;

    let currentScale = 1.0;
    let currentFitMode = 'width'; // 'width' | 'page' | 'value' (manual)

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const retryBtn = document.getElementById('retry-btn');
    const pageSpinner = document.getElementById('page-spinner');
    const container = document.getElementById('viewer-container');

    const prevBtn = document.getElementById('prev-page-btn');
    const nextBtn = document.getElementById('next-page-btn');
    const pageInput = document.getElementById('page-input');
    const pageTotal = document.getElementById('page-total');
    const zoomLevel = document.getElementById('zoom-level');

    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const zoomFitBtn = document.getElementById('zoom-fit-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const openExternalBtn = document.getElementById('open-external-btn');

    let renderTask = null;

    // Optional: cap DPR on low-memory devices for better performance
    function getDeviceDPR() {
      const dpr = window.devicePixelRatio || 1;
      const memory = navigator.deviceMemory || 4;
      const cap = memory < 4 ? 1.5 : 2;
      return Math.min(dpr, cap);
    }

    // Compute a safe internal render scale so the canvas backing store never
    // exceeds the browser limit (~16k px). At extreme zoom we render slightly
    // smaller internally and let CSS upscale (minor blur, but no crash/black canvas).
    function getRenderScale(page, scale) {
      const dpr = getDeviceDPR();
      const unscaled = page.getViewport({ scale: 1 });
      const maxDim = Math.max(unscaled.width, unscaled.height) * scale * dpr;
      const CAP = 16000;
      return maxDim > CAP ? scale * (CAP / maxDim) : scale;
    }

    function updateZoomReadout() {
      zoomLevel.textContent = `${Math.round(currentScale * 100)}%`;
    }

    // Remember last page per document
    function saveLastPage(pageNum) {
      if (!pdfFileName) return;
      try {
        localStorage.setItem(`lastPage_${pdfFileName}`, String(pageNum));
      } catch (_) {}
    }

    function restoreLastPage() {
      if (!pdfFileName) return 1;
      try {
        const saved = localStorage.getItem(`lastPage_${pdfFileName}`);
        if (saved) {
          const num = parseInt(saved, 10);
          if (!isNaN(num) && num > 0) return num;
        }
      } catch (_) {}
      return 1;
    }

    /**
     * Render PDF page onto high-DPI canvas
     */
    async function renderPage(num) {
      pageRendering = true;
      if (initialLoadDone) {
        pageSpinner.style.display = 'block';
      } else {
        loadingOverlay.style.display = 'flex';
      }

      if (renderTask) {
        try { renderTask.cancel(); } catch (_) {}
      }

      try {
        const page = await pdfDoc.getPage(num);
        const unscaledViewport = page.getViewport({ scale: 1.0 });

        // 1. Calculate dynamic scale for Fit-to-Width / Fit-to-Page modes
        if (currentFitMode === 'width') {
          const containerWidth = container.clientWidth;
          const padding = window.innerWidth <= 768 ? 16 : 24;
          currentScale = (containerWidth - padding) / unscaledViewport.width;
        } else if (currentFitMode === 'page') {
          const containerWidth = container.clientWidth;
          const containerHeight = container.clientHeight;
          const paddingX = window.innerWidth <= 768 ? 16 : 24;
          const paddingY = window.innerWidth <= 768 ? 16 : 24;
          const scaleX = (containerWidth - paddingX) / unscaledViewport.width;
          const scaleY = (containerHeight - paddingY) / unscaledViewport.height;
          currentScale = Math.min(scaleX, scaleY);
        }
        currentScale = clamp(currentScale, MIN_SCALE, MAX_SCALE);

        const renderScale = getRenderScale(page, currentScale);
        const dpr = getDeviceDPR();

        // Display size uses the intended scale; internal render may be capped for safety
        const displayViewport = page.getViewport({ scale: currentScale });
        const renderViewport = page.getViewport({ scale: renderScale });

        canvas.style.width = `${displayViewport.width}px`;
        canvas.style.height = `${displayViewport.height}px`;
        canvas.width = renderViewport.width * dpr;
        canvas.height = renderViewport.height * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const renderContext = {
          canvasContext: ctx,
          viewport: renderViewport
        };

        renderTask = page.render(renderContext);
        await renderTask.promise;

        pageRendering = false;
        pageSpinner.style.display = 'none';
        loadingOverlay.style.display = 'none';
        retryBtn.style.display = 'none';
        initialLoadDone = true;

        // Update navigation UI
        pageInput.value = num;
        pageTotal.textContent = pdfDoc.numPages;
        prevBtn.disabled = num <= 1;
        nextBtn.disabled = num >= pdfDoc.numPages;
        updateZoomReadout();
        saveLastPage(num);

        // Update browser URL silently
        const url = new URL(window.location);
        url.searchParams.set('page', num);
        window.history.replaceState({}, '', url);

        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      } catch (err) {
        if (err.name === 'RenderingCancelledException') {
          // Render was superseded — never leave pageRendering stuck, run the queued page
          pageRendering = false;
          if (pageNumPending !== null) {
            const p = pageNumPending;
            pageNumPending = null;
            renderPage(p);
          }
          return;
        }
        // Real error: still release the lock so the app can recover / retry
        pageRendering = false;
        console.error("Render error:", err);
        pageSpinner.style.display = 'none';
        loadingText.textContent = "Erreur de rendu.";
        loadingOverlay.style.display = 'flex';
        retryBtn.style.display = 'inline-block';
      }
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function onPrevPage() {
      if (currentPageNum <= 1) return;
      currentPageNum--;
      queueRenderPage(currentPageNum);
    }

    function onNextPage() {
      if (currentPageNum >= pdfDoc.numPages) return;
      currentPageNum++;
      queueRenderPage(currentPageNum);
    }

    // Nav Event Listeners
    prevBtn.addEventListener('click', onPrevPage);
    nextBtn.addEventListener('click', onNextPage);

    // Editable page input
    pageInput.addEventListener('change', () => {
      if (!pdfDoc) return;
      let n = parseInt(pageInput.value, 10);
      if (isNaN(n)) { pageInput.value = currentPageNum; return; }
      n = clamp(n, 1, pdfDoc.numPages);
      if (n !== currentPageNum) {
        currentPageNum = n;
        queueRenderPage(currentPageNum);
      } else {
        pageInput.value = currentPageNum;
      }
    });

    // Switch to manual zoom mode (so +/- and fit toggle behave predictably)
    function enterManualZoom() {
      if (currentFitMode === 'width' || currentFitMode === 'page') {
        currentFitMode = 'value';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        zoomFitBtn.title = "Ajuster à la largeur";
      }
    }

    // Zoom Out
    zoomOutBtn.addEventListener('click', () => {
      enterManualZoom();
      if (currentScale <= MIN_SCALE) return;
      currentScale = clamp(currentScale - 0.15, MIN_SCALE, MAX_SCALE);
      queueRenderPage(currentPageNum);
    });

    // Zoom In
    zoomInBtn.addEventListener('click', () => {
      enterManualZoom();
      if (currentScale >= MAX_SCALE) return;
      currentScale = clamp(currentScale + 0.15, MIN_SCALE, MAX_SCALE);
      queueRenderPage(currentPageNum);
    });

    // Fit to Width / Page Toggle
    zoomFitBtn.addEventListener('click', () => {
      if (currentFitMode === 'width') {
        currentFitMode = 'page';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-arrows-to-eye"></i>';
        zoomFitBtn.title = "Ajuster à la page entière";
      } else {
        currentFitMode = 'width';
        zoomFitBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        zoomFitBtn.title = "Ajuster à la largeur";
      }
      queueRenderPage(currentPageNum);
    });

    // Double-click / double-tap on canvas toggles fit mode
    canvas.addEventListener('dblclick', () => zoomFitBtn.click());

    // Open / share the PDF:
    //  - Android Capacitor app: use @capacitor/share with the local bundled PDF
    //    (pdfUrl is relative -> served by the app itself, so it's fast and offline)
    //  - Android browser: Web Share API with files
    //  - Everything else (PC web): open in a new browser tab (browser's own viewer)
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          if (typeof result === 'string') resolve(result.split(',')[1]);
          else reject(new Error('Failed to read PDF blob'));
        };
        reader.onerror = () => reject(reader.error || new Error('FileReader error'));
        reader.readAsDataURL(blob);
      });
    }

    async function fetchPdfBlob() {
      const res = await fetch(pdfUrl);
      if (!res.ok) throw new Error('PDF fetch failed (status ' + res.status + ')');
      return res.blob();
    }

    async function openExternal() {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const cap = window.Capacitor;
      const useCapacitor = !!(cap && cap.isNativePlatform && cap.isNativePlatform() &&
        cap.Plugins && cap.Plugins.Share && cap.Plugins.Filesystem);

      if (useCapacitor) {
        try {
          // pdfUrl is relative (pdfs/...) -> served by the app's own localhost (local, offline)
          const blob = await fetchPdfBlob();
          const base64 = await blobToBase64(blob);
          const safeName = 'drcat_' + pdfFileName.replace(/[^\w.-]/g, '_');
          const fs = cap.Plugins.Filesystem;
          await fs.writeFile({ path: safeName, data: base64, directory: 'CACHE', recursive: true });
          const { uri } = await fs.getUri({ path: safeName, directory: 'CACHE' });
          await cap.Plugins.Share.share({ title: displayTitle || pdfFileName, files: [uri] });
        } catch (e) {
          if (e && e.name === 'AbortError') return; // user cancelled the share sheet
          console.warn('Capacitor share failed:', e);
          return; // no useful fallback inside the native WebView
        }
        return;
      }

      if (isAndroid && navigator.canShare && navigator.canShare({ files: [new File([], pdfFileName, { type: 'application/pdf' })] })) {
        try {
          const blob = await fetchPdfBlob();
          await navigator.share({
            title: displayTitle,
            files: [new File([blob], pdfFileName, { type: 'application/pdf' })]
          });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return; // user cancelled the share sheet
          console.warn('Share failed, falling back to new tab:', e);
        }
      }
      // Fallback / non-Android: open in a new browser tab (browser's own PDF viewer)
      window.open(pdfUrl, '_blank', 'noopener,noreferrer');
    }
    openExternalBtn.addEventListener('click', openExternal);

    // Fullscreen API implementation
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error("Fullscreen request failed:", err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Back button history navigation
    const backBtn = document.querySelector('.back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });
    }

    // Sync fullscreen button icon
    document.addEventListener('fullscreenchange', () => {
      const icon = fullscreenBtn.querySelector('i');
      if (document.fullscreenElement) {
        icon.className = 'fa-solid fa-compress';
      } else {
        icon.className = 'fa-solid fa-expand';
      }
      // Re-render to adapt to full height/width changes
      setTimeout(() => {
        if (!pageRendering) queueRenderPage(currentPageNum);
      }, 100);
    });

    // Reliable orientation/container resize handling (fires on observe too, so guard until loaded)
    const resizeObserver = new ResizeObserver(() => {
      if (!pdfDoc) return;
      if (currentFitMode === 'width' || currentFitMode === 'page') {
        queueRenderPage(currentPageNum);
      }
    });
    resizeObserver.observe(container);

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowLeft') {
        onPrevPage();
      } else if (e.key === 'ArrowRight') {
        onNextPage();
      } else if (e.key === '+' || e.key === '=') {
        zoomInBtn.click();
      } else if (e.key === '-' || e.key === '_') {
        zoomOutBtn.click();
      } else if (e.key === 'f' || e.key === 'F') {
        zoomFitBtn.click();
      }
    });

    // Retry button
    retryBtn.addEventListener('click', () => {
      location.reload();
    });

    // Load PDF Document
    (async function() {
      try {
        // Phase 5.3: defer the pdf.js worker fetch until a PDF actually loads.
        if (window.pdfjsLib) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
        }
        const loadingTask = pdfjsLib.getDocument(pdfUrl);

        // Fetch progress indicator
        loadingTask.onProgress = (progressData) => {
          if (progressData.total && progressData.loaded !== undefined) {
            const percent = Math.round((progressData.loaded / progressData.total) * 100);
            loadingText.textContent = `Chargement... ${percent}%`;
          } else {
            loadingText.textContent = `Chargement... (${Math.round(progressData.loaded / 1024)} kB)`;
          }
        };

        pdfDoc = await loadingTask.promise;

        // Resume at last page, but respect an explicit ?page= deep link
        const explicitPage = parseInt(urlParams.get('page'));
        currentPageNum = (explicitPage && explicitPage > 0)
          ? clamp(explicitPage, 1, pdfDoc.numPages)
          : clamp(restoreLastPage(), 1, pdfDoc.numPages);

        renderPage(currentPageNum);
      } catch (err) {
        console.error("Load error:", err);
        loadingText.textContent = "Erreur de chargement du PDF. Vérifiez le fichier.";
        document.getElementById('loading-overlay').querySelector('.spinner').style.display = 'none';
        retryBtn.style.display = 'inline-block';
      }
    })();
  </script>
</body>
</html>
