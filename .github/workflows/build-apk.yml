name: Build Android APK

on:
  push:
    branches:
      - android-app
      - light-android
      - audit-project

  # Enable manual triggering
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Remote Server Config
        if: env.REMOTE_SERVER_URL_SECRET != ''
        env:
          REMOTE_SERVER_URL_SECRET: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          echo '{"urls": ["${{ secrets.REMOTE_SERVER_URL }}"], "primaryProvider": "ngrok"}' > remote_server_config.json

      - name: Copy Databases (Build Step)
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Determine Build Type and Configuration
        id: build_config
        run: |
          BUILD_TYPE="debug"
          GRADLE_CMD="assembleDebug"
          ARTIFACT_NAME="drcat-debug-apk"
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            BUILD_TYPE="release"
            GRADLE_CMD="assembleRelease"
            ARTIFACT_NAME="drcat-release-apk"
          fi
          
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "gradle_cmd=$GRADLE_CMD" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Build Android App (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew ${{ steps.build_config.outputs.gradle_cmd }}

      - name: Sign Release APK
        if: steps.build_config.outputs.build_type == 'release' && env.SIGNING_KEY != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_config.outputs.artifact_name }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*-unsigned.apk
            android/app/build/outputs/apk/release/*-signed.apk
            android/app/build/outputs/apk/release/app-release.apk

