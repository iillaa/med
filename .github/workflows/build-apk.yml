name: Build Android APK

on:
  push:
    branches:
      - master
      - beta-test
      - beta-test-pr
      - android-app
      - 0x-alpha

  # Enable manual triggering
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Remote Server Config
        env:
          REMOTE_SERVER_URL_SECRET: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          python3 -c '
          import os, json
          secret = os.environ.get("REMOTE_SERVER_URL_SECRET", "").strip()
          primary_url = secret if secret else "https://rendition-duchess-dry.ngrok-free.dev"
          urls = [primary_url, "https://drcat.is-an-app.workers.dev"]
          with open("remote_server_config.json", "w") as f:
              json.dump({"primaryProvider": "ngrok", "urls": urls}, f, indent=2)
          '

      - name: Copy Databases & Build Static Client Assets
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Determine Build Type and Configuration
        id: build_config
        run: |
          BUILD_TYPE="release"
          GRADLE_CMD="assembleRelease"
          ARTIFACT_NAME="drcat-release-apk"
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            BUILD_TYPE="debug"
            GRADLE_CMD="assembleDebug"
            ARTIFACT_NAME="drcat-debug-apk"
          fi
          
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "gradle_cmd=$GRADLE_CMD" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      # Gradle cache is managed by setup-java + gradle actions — clearing it every
      # build defeats caching and slows builds. Removed.

      - name: Check Signing Secrets
        id: signing_check
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          # Step `if:` conditions cannot see this step's own env, so the presence
          # check must run in bash and publish its result as a step output.
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_signing_key=true" >> $GITHUB_OUTPUT
            echo "Signing key detected — release APK will be signed."
          else
            echo "has_signing_key=false" >> $GITHUB_OUTPUT
            echo "::warning::SIGNING_KEY secret is not set — release APK will be built UNSIGNED."
          fi

      - name: Build Android App (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean ${{ steps.build_config.outputs.gradle_cmd }}

      - name: Sign Release APK
        if: steps.build_config.outputs.build_type == 'release' && steps.signing_check.outputs.has_signing_key == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Determine Artifact Path & Prepare Renamed APK
        id: artifact_path
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          SRC_PATH="android/app/build/outputs/apk/release/*-unsigned.apk"
          IS_SIGNED="false"
          if [ "${{ steps.build_config.outputs.build_type }}" = "debug" ]; then
            SRC_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          elif [ "${{ steps.sign_app.outputs.signedReleaseFile }}" != "" ]; then
            SRC_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
            IS_SIGNED="true"
          fi

          # Expand wildcard path if needed
          SRC_FILE=$(ls $SRC_PATH 2>/dev/null | head -n 1)
          
          RENAMED_NAME="DrCAT-v${VERSION}.apk"
          DEST_DIR="android/app/build/outputs/apk/publish"
          mkdir -p $DEST_DIR
          RENAMED_PATH="${DEST_DIR}/${RENAMED_NAME}"

          cp "$SRC_FILE" "$RENAMED_PATH"

          echo "path=$RENAMED_PATH" >> $GITHUB_OUTPUT
          echo "renamed_name=$RENAMED_NAME" >> $GITHUB_OUTPUT
          echo "is_signed=$IS_SIGNED" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrCAT-v${{ steps.artifact_path.outputs.version }}
          path: ${{ steps.artifact_path.outputs.path }}

      - name: Publish GitHub Release (Unzipped APK)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        # Never publish unsigned/debug APKs as user-facing releases — an unsigned
        # APK cannot be installed over the existing signed app.
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta-test-pr' || github.ref == 'refs/heads/0x-alpha') && steps.artifact_path.outputs.is_signed == 'true'
        with:
          tag_name: v${{ steps.artifact_path.outputs.version }}
          name: Dr. CAT v${{ steps.artifact_path.outputs.version }}
          body: |
            🩺 **Dr. CAT — Application de Rappel Clinique (v${{ steps.artifact_path.outputs.version }})**

            ### 📲 Téléchargement Direct
            - Téléchargez le fichier **`DrCAT-v${{ steps.artifact_path.outputs.version }}.apk`** ci-dessous pour l'installer directement sur votre smartphone Android.

            ### 🌐 Application Web Client
            - Accessible 24h/24 via Cloudflare Edge : https://drcat.is-an-app.workers.dev
          files: ${{ steps.artifact_path.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


